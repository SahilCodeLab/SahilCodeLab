name: Generate Snake

on:
  # Runs every 6 hours automatically
  schedule:
    - cron: "0 */6 * * *"

  # Allows you to run this action manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checks out your repository
      - uses: actions/checkout@v4

      # 2. Generates the snake animation SVG files
      - uses: Platane/snk/svg-only@v3
        id: snake-gif
        with:
          github_user_name: SahilCodeLab
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#00d2ff&color_dots=#161b22,#1f2937,#0070f3,#00d2ff,#7c3aed

      # 3. Push the changes to the output branch automatically
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "Update snake animation [skip ci]"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
